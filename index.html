<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busan CVS Map | 편의점 지도</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Panel -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🏪</span>
                    <h1>Busan CVS</h1>
                </div>
                <p class="subtitle">부산 편의점 분포 지도</p>
            </div>
            
            <div class="filter-section">
                <h2>📍 지역 선택</h2>
                <div class="custom-select">
                    <select id="region-select">
                        <option value="all">부산 전체</option>
                        <!-- Options will be populated by JS -->
                    </select>
                </div>
            </div>

            <div class="filter-section">
                <h2>🏪 브랜드 선택</h2>
                <div class="brand-filters" id="brand-filters">
                    <!-- Checkboxes will be populated by JS -->
                </div>
            </div>
            
            <div class="stats-section">
                <div class="stat-card">
                    <span class="stat-label">조회된 편의점</span>
                    <span class="stat-value" id="store-count">0</span>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="map-wrapper">
            <div id="map"></div>
            
            <!-- Loading Overlay -->
            <div id="loading" class="loading-overlay">
                <div class="spinner"></div>
                <p>데이터를 불러오는 중입니다...</p>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
